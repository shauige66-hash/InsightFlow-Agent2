# 部署用编排：API + PostgreSQL(pgvector) + Redis。
#
#   cp .env.example .env        # 填 DEEPSEEK_API_KEY 与 INSIGHTFLOW_API_KEYS
#   docker compose -f deploy/compose.app.yaml up -d --build
#
# 与 dev 的 deploy/compose.yaml 的区别：那份只起本地开发依赖，API 在你本机跑；
# 这份把 API 也装进容器，用 PostgreSQL 存会话/记忆/知识，Redis 做检索缓存。
#
# 默认为容器化 API/存储（SQL 分析可用）。Python/Plot 需受信 Linux runner；
# 使用 compose.sandbox.yaml 的同路径挂载、Docker socket/GID 合同，详见 deploy/README.md。
# Windows/macOS Docker Desktop 建议 API 在宿主运行。

name: insightflow

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightflow}
      POSTGRES_DB: ${POSTGRES_DB:-insightflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightflow} -d ${POSTGRES_DB:-insightflow}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      INSIGHTFLOW_STORAGE: postgres
      INSIGHTFLOW_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-insightflow}:${POSTGRES_PASSWORD:-insightflow}@postgres:5432/${POSTGRES_DB:-insightflow}
      INSIGHTFLOW_REDIS_ENABLED: "true"
      INSIGHTFLOW_REDIS_URL: redis://redis:6379/0
      INSIGHTFLOW_OWNER: ${INSIGHTFLOW_OWNER:-local-demo}
      # inline：Run 在 API 进程内跑（默认）；queue：入队，由 worker 执行
      INSIGHTFLOW_EXECUTION: ${INSIGHTFLOW_EXECUTION:-inline}
      # 留空即单用户演示模式；设置了就强制 Bearer 鉴权
      INSIGHTFLOW_API_KEYS: ${INSIGHTFLOW_API_KEYS:-}
      INSIGHTFLOW_ARTIFACT_SIGNING_KEY: ${INSIGHTFLOW_ARTIFACT_SIGNING_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_SIGN_SECRET: ${FEISHU_SIGN_SECRET:-}
    ports:
      # 只绑回环：前面要放反向代理再对外
      - "127.0.0.1:${API_PORT:-8080}:8000"
    volumes:
      - outputs:/app/outputs
      - uploads:/app/uploads
      # Python/Plot 使用 Linux 专用 compose.sandbox.yaml；单挂 socket 不足。
    restart: unless-stopped

  # 队列模式的执行者。只在 INSIGHTFLOW_EXECUTION=queue 时启动：
  #   INSIGHTFLOW_EXECUTION=queue docker compose -f deploy/compose.app.yaml --profile queue up -d
  # 抢占使用 SKIP LOCKED，Run 执行另用持续续租与 fencing；不是模型请求恰好一次。
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    profiles: ["queue"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "scripts/run_worker.py"]
    environment:
      INSIGHTFLOW_STORAGE: postgres
      INSIGHTFLOW_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-insightflow}:${POSTGRES_PASSWORD:-insightflow}@postgres:5432/${POSTGRES_DB:-insightflow}
      INSIGHTFLOW_EXECUTION: queue
      INSIGHTFLOW_REDIS_ENABLED: "true"
      INSIGHTFLOW_REDIS_URL: redis://redis:6379/0
      INSIGHTFLOW_OWNER: ${INSIGHTFLOW_OWNER:-local-demo}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_SIGN_SECRET: ${FEISHU_SIGN_SECRET:-}
    volumes:
      - outputs:/app/outputs
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  pgdata:
  outputs:
  uploads:
