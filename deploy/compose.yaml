name: insightflow-agent2

# 本地开发依赖：PostgreSQL + pgvector 与 Redis。
#
# 端口刻意避开默认值（PostgreSQL 5433、Redis 6380）：本机常见的 5432 已经
# 被其他实例占用，用默认端口会让测试悄悄连到别人的库。
#
#   docker compose -f deploy/compose.yaml up -d
#   docker compose -f deploy/compose.yaml down -v
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightflow}
      POSTGRES_DB: ${POSTGRES_DB:-insightflow}
    ports:
      # 只绑定回环地址：本地开发依赖不该暴露到局域网
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - insightflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightflow} -d ${POSTGRES_DB:-insightflow}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  insightflow-pgdata:
