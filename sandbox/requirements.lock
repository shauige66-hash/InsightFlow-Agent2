# 沙箱依赖锁文件：精确固定，供 Dockerfile 使用。
#
# 生成方式：在 python:3.11-slim 容器内执行
#   pip install --dry-run --report ... pandas==3.0.6 numpy==2.4.6 \
#       matplotlib==3.11.2 openpyxl==3.1.5
# 并把解析出的全部包（含传递依赖）按 name==version 写入本文件。
#
# 为什么顶层版本与宿主对齐：宿主与沙箱之间要传递 DataFrame 与绘图结果，
# 版本漂移会让 to_json/read_json 的往返语义产生差异。宿主当前为
# pandas 3.0.6 / numpy 2.4.6 / matplotlib 3.11.2 / openpyxl 3.1.5。
#
# 锁定边界（不过度声称）：
#   - 本文件锁定 PyPI 包版本，但 wheel 本身由 PyPI 解析，未按 sha256 固定；
#   - 基础镜像在 Dockerfile 中按 **digest** 固定（python@sha256:e88e9763...），
#     不是可变 tag；但该 digest 是本机已核验的 linux/amd64 镜像 digest，
#     尚未与官方 manifest-list digest 比对（本机 registry 不可达）；
#   - 系统包（fontconfig / fonts-noto-cjk）只固定包名，未固定 Debian 版本。

