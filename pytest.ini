[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# 手工演示脚本在 scripts/manual/，不在收集路径内。
python_files = test_*.py
markers =
    slow: 需要加载本地 embedding 模型等较重依赖的用例
    sandbox: 需要真实 Docker 沙箱镜像的隔离用例（Docker 不可用时跳过）
    sandbox_runtime: 真实启动容器并断言容器内行为的用例
    sandbox_fault: Docker 不可用/镜像缺失/超时/OOM 等故障路径用例（多数不打桩，不需容器）
    sandbox_static: 只做源码、缓存键或参数结构断言的用例（不启动容器）
filterwarnings =
    error::DeprecationWarning:agents.*
    error::DeprecationWarning:core.*
    error::DeprecationWarning:rag.*
    error::DeprecationWarning:tools.*
